services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: skillhub
      POSTGRES_USER: skillhub
      POSTGRES_PASSWORD: skillhub_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      BACKEND_HTTP_PORT: "8080"
      DATABASE_URL: "postgres://skillhub:skillhub_dev@postgres:5432/skillhub?sslmode=disable"
      BACKEND_JWT_SECRET: "dev-secret"
      STORAGE_BASE_PATH: "/var/lib/skillhub/packages"
      BOOTSTRAP_ADMIN_ENABLED: "true"
      BOOTSTRAP_ADMIN_USERNAME: "admin"
      BOOTSTRAP_ADMIN_PASSWORD: "ChangeMe!2026"
    volumes:
      - skill_packages:/var/lib/skillhub/packages
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  skill_packages:
